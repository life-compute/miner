name: Build GUI Installer

on:
  push:
    paths:
      - 'gui/**'
      - '.github/workflows/gui-build.yml'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux build (.AppImage + .deb) ──────────────────────────────────────
  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './gui/src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci
        working-directory: gui

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: life-compute-miner-linux-AppImage
          path: gui/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: life-compute-miner-linux-deb
          path: gui/src-tauri/target/release/bundle/deb/*.deb

  # ── Windows build (.msi + NSIS .exe) ─────────────────────────────────────
  build-windows:
    name: Windows (msi + exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './gui/src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci
        working-directory: gui

      - name: Build Tauri app (Windows)
        run: npm run tauri build
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: life-compute-miner-windows-msi
          path: gui/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS .exe
        uses: actions/upload-artifact@v4
        with:
          name: life-compute-miner-windows-exe
          path: gui/src-tauri/target/release/bundle/nsis/*.exe

  # ── macOS build (.dmg) ───────────────────────────────────────────────────
  build-macos:
    name: macOS (dmg)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './gui/src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci
        working-directory: gui

      - name: Build Tauri app (macOS universal)
        run: npm run tauri build -- --target universal-apple-darwin
        working-directory: gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: life-compute-miner-macos-dmg
          path: gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── Create GitHub Release with all artifacts ─────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' gui/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "gui-v${{ steps.version.outputs.version }}"
          name: "LIFE Compute Miner GUI v${{ steps.version.outputs.version }}"
          body: |
            ## LIFE Compute Miner GUI Installer

            Your GPU could help cure cancer. Download for your platform:

            | Platform | File |
            |---|---|
            | 🐧 Linux | `.AppImage` (no install) or `.deb` (Debian/Ubuntu) |
            | 🪟 Windows | `.msi` (recommended) or `.exe` (NSIS) |
            | 🍎 macOS | `.dmg` (universal — Intel + Apple Silicon) |

            ### Requirements
            - NVIDIA GPU with ≥8 GB VRAM
            - 16 GB system RAM
            - 20 GB free disk
            - CUDA 11.8+
            - Docker (will prompt to install if missing)

            ### First run
            1. Open the installer
            2. System requirements are auto-checked
            3. Enter your Solana wallet address (or get [Phantom](https://phantom.app))
            4. Click Install — Docker image is pulled and miner starts automatically
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
