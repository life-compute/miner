<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <defs>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="lgG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="lgP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#cc44aa;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Left helix strand (green) — sinusoidal path -->
  <path d="M 30 10 Q 70 30 30 50 Q -10 70 30 90 Q 70 110 30 130 Q -10 150 30 170 Q 70 190 30 195"
        fill="none" stroke="url(#lgG)" stroke-width="3.5" stroke-linecap="round"
        filter="url(#glow-green)" opacity="0.95"/>

  <!-- Right helix strand (pink) — phase-shifted -->
  <path d="M 90 10 Q 50 30 90 50 Q 130 70 90 90 Q 50 110 90 130 Q 130 150 90 170 Q 50 190 90 195"
        fill="none" stroke="url(#lgP)" stroke-width="3.5" stroke-linecap="round"
        filter="url(#glow-pink)" opacity="0.95"/>

  <!-- Base pairs (rungs) — 9 horizontal connectors -->
  <line x1="30" y1="10"  x2="90" y2="10"  stroke="#00ff41" stroke-width="2" opacity="0.7" filter="url(#glow-green)"/>
  <line x1="30" y1="30"  x2="90" y2="30"  stroke="#ff69b4" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="50"  x2="90" y2="50"  stroke="#00ff41" stroke-width="2" opacity="0.7" filter="url(#glow-green)"/>
  <line x1="30" y1="70"  x2="90" y2="70"  stroke="#ff69b4" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="90"  x2="90" y2="90"  stroke="#00ff41" stroke-width="2" opacity="0.8" filter="url(#glow-green)"/>
  <line x1="30" y1="110" x2="90" y2="110" stroke="#ff69b4" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="130" x2="90" y2="130" stroke="#00ff41" stroke-width="2" opacity="0.7" filter="url(#glow-green)"/>
  <line x1="30" y1="150" x2="90" y2="150" stroke="#ff69b4" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="170" x2="90" y2="170" stroke="#00ff41" stroke-width="2" opacity="0.7" filter="url(#glow-green)"/>
  <line x1="30" y1="195" x2="90" y2="195" stroke="#ff69b4" stroke-width="1.5" opacity="0.4"/>

  <!-- Node dots at strand crossings -->
  <circle cx="30" cy="10"  r="4" fill="#00ff41" filter="url(#glow-green)" opacity="0.9"/>
  <circle cx="90" cy="10"  r="4" fill="#ff69b4" filter="url(#glow-pink)"  opacity="0.9"/>
  <circle cx="30" cy="50"  r="4" fill="#00ff41" filter="url(#glow-green)" opacity="0.9"/>
  <circle cx="90" cy="50"  r="4" fill="#ff69b4" filter="url(#glow-pink)"  opacity="0.9"/>
  <circle cx="30" cy="90"  r="5" fill="#00ff41" filter="url(#glow-green)" opacity="1"/>
  <circle cx="90" cy="90"  r="5" fill="#ff69b4" filter="url(#glow-pink)"  opacity="1"/>
  <circle cx="30" cy="130" r="4" fill="#00ff41" filter="url(#glow-green)" opacity="0.9"/>
  <circle cx="90" cy="130" r="4" fill="#ff69b4" filter="url(#glow-pink)"  opacity="0.9"/>
  <circle cx="30" cy="170" r="4" fill="#00ff41" filter="url(#glow-green)" opacity="0.9"/>
  <circle cx="90" cy="170" r="4" fill="#ff69b4" filter="url(#glow-pink)"  opacity="0.9"/>
</svg>
